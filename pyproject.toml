[project]
name = "agent-reliability"
version = "0.1.0"
description = "A deterministic evaluation harness for AI agent reliability and invariant checking"
readme = "README.md"
authors = [
    { name = "Sanjil Cleetus D'silva" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "langchain-core>=1.8.4",
    "langchain-google-genai>=4.5.2",
    "langgraph>=1.2.24",
    "openai>=3.58.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
agent-reliability = "agent_reliability:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
